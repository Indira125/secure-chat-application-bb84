<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantum Secure Chat – BB84</title>

    <style>
        body {
            background: #0b0f1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 75%;
            margin: auto;
            padding-top: 20px;
        }

        h1 {
            color: #00e5ff;
        }

        h2 {
            color: #7ddcff;
        }

        h3 {
            margin-bottom: 6px;
        }

        .box {
            background: #12192c;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
        }

        input, textarea, button {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
        }

        /* 🔥 ONLY TEXT SIZE IS INCREASED */
        textarea {
            font-size: 22px;   /* BIGGER MESSAGE TEXT */
            line-height: 1.6;
            font-family: Consolas, "Courier New", monospace;
        }

        button {
            background: #00bcd4;
            color: black;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #00acc1;
        }

        .status {
            font-size: 18px;
            margin-top: 10px;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .col {
            width: 50%;
        }

        /* Encrypted output styling */
        .col.encrypted textarea {
            background: #0d1b2a;
            color: #00e5ff;
        }

        /* Decrypted output styling */
        .col.decrypted textarea {
            background: #102a13;
            color: #7CFF7C;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🔐 Quantum Secure Chat</h1>
    <p>BB84 Quantum Key Distribution + AES Encryption</p>

    <!-- KEY GENERATION -->
    <form method="POST">
        <button name="generate">Generate Quantum Key</button>
        <button name="reset">Reset Session</button>
    </form>

    <div class="status">{{ status }}</div>

    <!-- ENCRYPTION INPUT -->
    <div class="box">
        <h2>🔒 Encryption</h2>
        <form method="POST">
            <textarea name="plain_message" placeholder="Enter plain text message here..."></textarea>
            <button name="encrypt">Encrypt Message</button>
        </form>
    </div>

    <!-- DECRYPTION INPUT -->
    <div class="box">
        <h2>🔓 Decryption</h2>
        <form method="POST">
            <textarea name="encrypted_message" placeholder="Paste encrypted message (hex format) here..."></textarea>
            <button name="decrypt">Decrypt Message</button>
        </form>
    </div>

    <!-- OUTPUT SECTION -->
    <div class="box">
        <h2>🔐 Encryption vs Decryption Output</h2>

        <div class="row">
            <div class="col encrypted">
                <h3>🔒 Encrypted Message</h3>
                <textarea readonly>{{ encrypted }}</textarea>
            </div>

            <div class="col decrypted">
                <h3>🔓 Decrypted Message</h3>
                <textarea readonly>{{ decrypted }}</textarea>
            </div>
        </div>
    </div>

</div>
</body>
</html>
